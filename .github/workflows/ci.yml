name: ci

on:
  push:
    branches: [main, develop, 'task/**']
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Content, template-residue and artifact guards (stdlib only)
        run: |
          python scripts/check_content_standards.py
          python scripts/check_template_residue.py
          python scripts/check_artifacts.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            data-pipeline/requirements.txt
            requirements-dev.txt
      - name: Install the offline lane (spinoct from PyPI) and dev tools
        run: python -m pip install -r requirements-precompute.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check data-pipeline tests scripts app
      - name: Tests (materials, registry, artifact invariants, sandboxed bake smoke, docs, versions)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type-check and build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
