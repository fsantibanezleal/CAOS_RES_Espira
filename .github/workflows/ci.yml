name: ci

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Content, template-residue and artifact guards (stdlib only)
        run: |
          python scripts/check_content_standards.py
          python scripts/check_template_residue.py
          python scripts/check_artifacts.py

      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            data-pipeline/requirements.txt
            requirements-dev.txt
      - name: Install the offline lane (spinoct from PyPI) and dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check data-pipeline tests scripts app
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type-check and build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Install the browser for the gates
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: frontend/e2e-shots
