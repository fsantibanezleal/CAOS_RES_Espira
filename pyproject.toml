# Repo-local tool configuration only. The product declares no package of its own
# (conventions/no-internal-packages.md): the engine is the separate PyPI package `spinoct`, and
# data-pipeline/ is scripts invoked by path (python data-pipeline/run.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Explicit, so the pinned ruff in requirements-dev.txt and any local ruff check the same rules.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["espiralab"]
